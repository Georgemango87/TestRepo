// Game screen (family-aware)
// ============================================================

function renderGame(root) {
  const game = GAMES[G.scriptId];
  const family = game.family;

  const header = el('div', { class: 'game__header' },
    el('span', { class: 'game__header-title' }, game.name),
    el('span', { class: 'game__header-info' },
      'Turn ', el('strong', null, String(G.turn || G.handNumber || 1)),
      '·', el('strong', null, G.players[G.current]?.name || '')),
    el('div', { style: { display: 'flex', gap: '0.35rem' } },
      undoStack.length > 0 ? el('button', { class: 'ghost game__header-btn', onclick: undo }, 'Undo') : null));

  const opponents = renderOpponents(game, family);
  const felt = family === 'poker' ? renderPokerFelt(game) :
               family === 'trash' ? renderTrashFelt(game) :
               renderGenericFelt(game);
  const actions = renderActions(game, family);
  const log = el('div', { class: 'log' });
  for (const line of G.log.slice(-5)) log.appendChild(el('div', null, line));

  const handArea = family === 'trash' ? renderTrashSlots(game) :
                   family === 'poker' ? renderPokerHand(game) :
                   renderGenericHand(game);

  root.appendChild(el('div', { class: 'game' },
    header, opponents, felt, actions, log, handArea));

  if (G.ended) root.appendChild(renderGameOver());
}

function renderOpponents(game, family) {
  const opponents = el('div', { class: 'opponents' });
  for (const p of G.players) {
    if (p.id === VIEWER) continue;
    const item = el('div', { class: 'opponent' + (G.current === p.id && !G.ended ? ' current' : '') });

    if (family === 'poker') {
      const ps = G.playerState[p.id];
      if (ps.folded) item.classList.add('folded');
      item.appendChild(el('strong', null, p.name));
      item.appendChild(el('span', { class: 'meta' }, 'Chips: ' + ps.chips));
      item.appendChild(el('span', { class: 'meta' },
        ps.folded ? 'Folded' : ps.allIn ? 'All-in' : 'Bet: ' + ps.bet));
      item.appendChild(el('span', { class: 'meta', style: { display: 'flex', gap: '0.2rem', marginTop: '0.2rem' } },
        ...G.hands[p.id]?.map(c => {
          const card = renderCardEl(c);
          card.classList.add('card--small');
          return card;
        }) || []));
    } else if (family === 'trash') {
      const slots = G.slots[p.id] || [];
      const revealed = slots.filter(c => c && c.faceUp).length;
      item.appendChild(el('strong', null, p.name));
      item.appendChild(el('span', { class: 'meta' }, revealed + '/' + slots.length + ' revealed'));
    } else {
      const hand = G.zones['hand:' + p.id];
      const sets = G.zones['sets:' + p.id];
      item.appendChild(el('strong', null, p.name));
      item.appendChild(el('span', { class: 'meta' }, (hand?.cards.length || 0) + ' cards'));
      if (sets) item.appendChild(el('span', { class: 'meta' },
        'Sets: ' + Math.floor((sets.cards.length || 0) / (game.config.setSize || 4))));
    }
    opponents.appendChild(item);
  }
  return opponents;
}

function renderGenericFelt(game) {
  const felt = el('div', { class: 'felt' });
  const row = el('div', { class: 'row' });

  // Deck
  const deckPile = el('div', { class: 'pile' });
  deckPile.appendChild(el('span', { class: 'pile__label' }, 'Deck'));
  const deckCount = G.zones.draw.cards.length;
  const deck = el('div', { class: 'deck' });
  const showCount = Math.min(3, Math.max(1, Math.ceil(deckCount / 15)));
  for (let i = 0; i < showCount; i++) deck.appendChild(el('div', { class: 'card card--back' }));
  if (deckCount > 0) deck.appendChild(el('span', { class: 'deck__count' }, String(deckCount)));
  else deck.appendChild(el('div', { class: 'pile__empty' }, '0'));
  deckPile.appendChild(deck);
  row.appendChild(deckPile);

  // Discard
  const discardPile = el('div', { class: 'pile' });
  discardPile.appendChild(el('span', { class: 'pile__label' }, 'Discard'));
  if (G.zones.discard && G.zones.discard.cards.length > 0)
    discardPile.appendChild(renderCardEl(topOf(G.zones.discard)));
  else discardPile.appendChild(el('div', { class: 'pile__empty' }, 'empty'));
  row.appendChild(discardPile);

  // Active color
  const activeProps = G.flags.activeProps || {};
  const activeColor = G.flags.activeColor || activeProps.color || activeProps.suit;
  if (activeColor) {
    let bg = COLOR_HEX[activeColor] || '#6b7280';
    let fg = LIGHT_COLORS.has(activeColor) ? '#1a1a1a' : 'white';
    if (activeColor === '♥' || activeColor === '♦') bg = '#cf2430';
    else if (activeColor === '♠' || activeColor === '♣') bg = '#1c1c20';
    const p = el('div', { class: 'pile' });
    p.appendChild(el('span', { class: 'pile__label' }, 'Active'));
    p.appendChild(el('span', { class: 'color-badge', style: { background: bg, color: fg } }, String(activeColor)));
    row.appendChild(p);
  }

  felt.appendChild(row);
  return felt;
}

function renderPokerFelt(game) {
  const felt = el('div', { class: 'felt' });

  // Pot
  const potDisplay = el('div', { class: 'pot-display' },
    el('span', { class: 'pot-display__label' }, 'Pot'),
    el('span', { class: 'pot-display__amount' }, String(G.pot || 0)));
  felt.appendChild(potDisplay);

  // Community cards
  const communityRow = el('div', { style: { display: 'flex', gap: '0.35rem', justifyContent: 'center' } });
  for (let i = 0; i < 5; i++) {
    const card = G.community[i];
    if (card) communityRow.appendChild(renderCardEl(card));
    else communityRow.appendChild(el('div', { class: 'pile__empty' }));
  }
  felt.appendChild(communityRow);

  // Phase + current bet
  const info = el('div', { style: { display: 'flex', gap: '0.6rem', alignItems: 'center' } },
    el('span', { class: 'color-badge', style: { background: 'var(--surface-glow)' } }, G.phase),
    G.currentBet > 0 ? el('span', { class: 'color-badge',
      style: { background: 'var(--gold)', color: '#111' } }, 'Bet: ' + G.currentBet) : null);
  felt.appendChild(info);

  return felt;
}

function renderPokerHand(game) {
  const hand = G.hands[VIEWER] || [];
  const wrap = el('div', { class: 'hand-wrap' });
  const handEl = el('div', { class: 'hand' });
  for (const c of hand) handEl.appendChild(renderCardEl(c));

  // Show current hand rank
  if (hand.length + G.community.length >= 5) {
    const h = bestHand([...hand, ...G.community]);
    wrap.appendChild(el('div', { class: 'stat', style: { textAlign: 'center', paddingBottom: '0.35rem' } },
      'Your best: ' + h.name));
  }
  wrap.appendChild(handEl);
  return wrap;
}

function renderTrashFelt(game) {
  const felt = el('div', { class: 'felt' });
  const row = el('div', { class: 'row' });

  const deckPile = el('div', { class: 'pile' });
  deckPile.appendChild(el('span', { class: 'pile__label' }, 'Deck'));
  const deckCount = G.zones.draw.cards.length;
  const deck = el('div', { class: 'deck' });
  for (let i = 0; i < Math.min(3, Math.max(1, Math.ceil(deckCount / 15))); i++)
    deck.appendChild(el('div', { class: 'card card--back' }));
  if (deckCount > 0) deck.appendChild(el('span', { class: 'deck__count' }, String(deckCount)));
  deckPile.appendChild(deck);
  row.appendChild(deckPile);

  const discardPile = el('div', { class: 'pile' });
  discardPile.appendChild(el('span', { class: 'pile__label' }, 'Discard'));
  if (G.zones.discard.cards.length > 0) discardPile.appendChild(renderCardEl(topOf(G.zones.discard)));
  else discardPile.appendChild(el('div', { class: 'pile__empty' }, 'empty'));
  row.appendChild(discardPile);

  if (G.drawnCard) {
    const drawnPile = el('div', { class: 'pile' });
    drawnPile.appendChild(el('span', { class: 'pile__label' }, 'Drawn'));
    drawnPile.appendChild(renderCardEl(G.drawnCard));
    row.appendChild(drawnPile);
  }

  felt.appendChild(row);
  return felt;
}

function renderTrashSlots(game) {
  const wrap = el('div', { class: 'hand-wrap' });
  const slots = G.slots[VIEWER] || [];
  const targetRanks = game.config.targetRanks || [];
  const isPlacing = G.current === VIEWER && G.phase === 'place' && G.drawnCard;
  const grid = el('div', { class: 'slot-grid' });

  for (let i = 0; i < slots.length; i++) {
    const c = slots[i];
    const target = targetRanks[i];
    const slotEl = el('div', { class: 'slot' });
    slotEl.appendChild(el('span', { class: 'slot__target' }, target));
    const cardEl = c ? renderCardEl(c) : el('div', { class: 'pile__empty' });
    if (isPlacing) {
      cardEl.style.cursor = 'pointer';
      cardEl.classList.add('card--playable');
      cardEl.addEventListener('click', () => takeAction({ type: 'PLACE_SLOT', slot: i }));
    }
    slotEl.appendChild(cardEl);
    grid.appendChild(slotEl);
  }

  wrap.appendChild(grid);
  return wrap;
}

function renderGenericHand(game) {
  const hand = G.zones['hand:' + VIEWER];
  const handEl = el('div', { class: 'hand' });
  if (hand) {
    const sorted = [...hand.cards].sort((a, b) => {
      const da = game.defs[a.defId], db = game.defs[b.defId];
      if (!da || !db) return 0;
      const ca = COLOR_ORDER[da.props?.color] ?? 99;
      const cb = COLOR_ORDER[db.props?.color] ?? 99;
      if (ca !== cb) return ca - cb;
      const sa = SUIT_ORDER[da.props?.suit] ?? 99;
      const sb = SUIT_ORDER[db.props?.suit] ?? 99;
      if (sa !== sb) return sa - sb;
      return String(da.props?.rank ?? '').localeCompare(String(db.props?.rank ?? ''));
    });
    for (const c of sorted) handEl.appendChild(renderCardEl(c));
  }
  return el('div', { class: 'hand-wrap' }, handEl);
}

function renderActions(game, family) {
  const actionsEl = el('div', { class: 'actions-bar' });
  const isMyTurn = !G.ended && G.current === VIEWER;

  if (!isMyTurn) {
    if (G.ended) actionsEl.appendChild(el('span', { class: 'actions-bar__label' }, 'Game over'));
    else actionsEl.appendChild(el('span', { class: 'actions-bar__label' }, 'Waiting for ' + G.players[G.current].name));
    return actionsEl;
  }

  if (family === 'poker') return renderPokerActions(game, actionsEl);
  if (family === 'trash') return renderTrashActions(game, actionsEl);
  if (family === 'ask') return renderAskActions(game, actionsEl);
  return renderShedActions(game, actionsEl);
}

function renderShedActions(game, container) {
  const actions = game.legal(G, VIEWER);
  if (G.phase === 'chooseProp') {
    container.appendChild(el('span', { class: 'actions-bar__label' }, 'Choose:'));
    for (const a of actions) {
      const btn = el('button', { class: 'chip', onclick: () => takeAction(a.cmd) });
      const hex = COLOR_HEX[a.value];
      if (hex) { btn.style.background = hex; btn.style.color = LIGHT_COLORS.has(a.value) ? '#111' : 'white'; }
      else if (a.value === '♠' || a.value === '♣') { btn.style.background = '#1c1c20'; btn.style.color = 'white'; }
      else if (a.value === '♥' || a.value === '♦') { btn.style.background = '#cf2430'; btn.style.color = 'white'; }
      btn.textContent = a.value;
      container.appendChild(btn);
    }
    return container;
  }
  const draw = actions.find(a => a.cmd.type === 'DRAW');
  const pass = actions.find(a => a.cmd.type === 'PASS');
  const plays = actions.filter(a => a.cmd.type === 'PLAY_CARD');
  if (plays.length > 0) container.appendChild(el('span', { class: 'actions-bar__label' }, 'Tap a card'));
  if (draw) container.appendChild(el('button', { class: 'primary', onclick: () => takeAction(draw.cmd) }, 'Draw'));
  if (pass) container.appendChild(el('button', { class: 'ghost', onclick: () => takeAction(pass.cmd) }, 'Pass'));

  // Wire hand click
  const hand = G.zones['hand:' + VIEWER];
  const handEl = document.querySelectorAll('.hand .card');
  plays.forEach(a => {
    const card = hand?.cards.find(c => c.id === a.cmd.cardId);
    if (!card) return;
    const idx = [...(hand?.cards || [])].sort((x, y) => {
      const da = game.defs[x.defId], db = game.defs[y.defId];
      const ca = COLOR_ORDER[da?.props?.color] ?? 99, cb = COLOR_ORDER[db?.props?.color] ?? 99;
      return ca - cb;
    }).findIndex(c => c.id === a.cmd.cardId);
    if (handEl[idx]) {
      handEl[idx].classList.add('card--playable');
      handEl[idx].addEventListener('click', () => takeAction(a.cmd));
    }
  });
  return container;
}

function renderAskActions(game, container) {
  const actions = game.legal(G, VIEWER);
  const values = [...new Set(actions.filter(a => a.cmd.type === 'ASK').map(a => a.value))];
  if (_pendingAskValue === null) {
    if (values.length === 0) {
      container.appendChild(el('button', { class: 'primary',
        onclick: () => takeAction({ type: 'DRAW' }) }, 'Draw a card'));
      return container;
    }
    container.appendChild(el('span', { class: 'actions-bar__label' }, 'Ask for:'));
    for (const v of values) {
      container.appendChild(el('button', { class: 'chip',
        onclick: () => { _pendingAskValue = v; render(); } }, String(v)));
    }
    return container;
  }
  container.appendChild(el('span', { class: 'actions-bar__label' }, `Ask for ${_pendingAskValue}:`));
  for (const a of actions) {
    if (a.cmd.type !== 'ASK' || a.value !== _pendingAskValue) continue;
    container.appendChild(el('button', { class: 'chip',
      onclick: () => { const cmd = a.cmd; _pendingAskValue = null; takeAction(cmd); } },
      G.players[a.target].name));
  }
  container.appendChild(el('button', { class: 'ghost tiny',
    onclick: () => { _pendingAskValue = null; render(); } }, 'Cancel'));
  return container;
}

function renderTrashActions(game, container) {
  const actions = game.legal(G, VIEWER);
  if (G.phase === 'draw') {
    container.appendChild(el('span', { class: 'actions-bar__label' }, 'Draw:'));
    for (const a of actions) {
      if (a.cmd.type === 'DRAW_DECK')
        container.appendChild(el('button', { class: 'primary', onclick: () => takeAction(a.cmd) }, 'Draw from deck'));
      if (a.cmd.type === 'TAKE_DISCARD')
        container.appendChild(el('button', { class: 'ghost', onclick: () => takeAction(a.cmd) }, 'Take from discard'));
    }
  } else if (G.phase === 'place') {
    container.appendChild(el('span', { class: 'actions-bar__label' }, 'Tap a slot to place'));
    container.appendChild(el('button', { class: 'ghost tiny', onclick: () => takeAction({ type: 'DISCARD_DRAWN' }) }, 'Discard'));
  }
  return container;
}

function renderPokerActions(game, container) {
  const actions = game.legal(G, VIEWER);
  const ps = G.playerState[VIEWER];
  const fold = actions.find(a => a.cmd.type === 'FOLD');
  const check = actions.find(a => a.cmd.type === 'CHECK');
  const call = actions.find(a => a.cmd.type === 'CALL');
  const raise = actions.find(a => a.cmd.type === 'RAISE');
  const allin = actions.find(a => a.cmd.type === 'ALL_IN');

  if (fold) container.appendChild(el('button', { class: 'danger', onclick: () => takeAction(fold.cmd) }, 'Fold'));
  if (check) container.appendChild(el('button', { class: 'primary', onclick: () => takeAction(check.cmd) }, 'Check'));
  if (call) container.appendChild(el('button', { class: 'primary', onclick: () => takeAction(call.cmd) }, 'Call ' + call.amount));

  if (raise) {
    const min = raise.min, max = raise.max;
    if (_raiseAmount == null) _raiseAmount = min;
    _raiseAmount = Math.max(min, Math.min(max, _raiseAmount));
    const slider = el('input', {
      type: 'range', min: min, max: max, value: _raiseAmount,
      oninput: e => { _raiseAmount = parseInt(e.target.value, 10); render(); },
    });
    container.appendChild(el('div', { class: 'bet-slider' },
      el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: 'var(--muted)' } },
        el('span', null, 'Raise to ' + _raiseAmount),
        el('span', null, min + '–' + max)),
      slider,
      el('div', { style: { display: 'flex', gap: '0.35rem', flexWrap: 'wrap' } },
        el('button', { class: 'primary', onclick: () => {
          takeAction({ type: 'RAISE', amount: _raiseAmount });
          _raiseAmount = null;
        } }, 'Raise to ' + _raiseAmount),
        el('button', { class: 'ghost tiny', onclick: () => { _raiseAmount = Math.min(ps.bet + ps.chips, min); render(); } }, 'Min'),
        el('button', { class: 'ghost tiny', onclick: () => { _raiseAmount = Math.floor((G.pot + G.currentBet) / 2); render(); } }, 'Half pot'),
        el('button', { class: 'ghost tiny', onclick: () => { _raiseAmount = max; render(); } }, 'Max'))));
  } else if (allin) {
    container.appendChild(el('button', { class: 'danger', onclick: () => takeAction(allin.cmd) }, 'All-in ' + allin.amount));
  }
  return container;
}

function renderGameOver() {
  const winnerNames = G.winners.map(w => G.players[w].name).join(', ');
  return el('div', { class: 'overlay game-over' },
    el('div', { class: 'modal' },
      el('div', { class: 'trophy' }, '🏆'),
      el('h2', null, winnerNames + (G.winners.length === 1 ? ' wins!' : ' win!')),
      el('button', { class: 'primary', onclick: playAgain }, 'Play again'),
      el('button', { class: 'ghost', onclick: () => { G = null; SCREEN = 'menu'; render(); } }, 'Back to menu')));
}

// ============================================================
// Actions
// ============================================================

function startGame() {
  const names = MENU.namesInput.split(',').map(s => s.trim()).filter(Boolean);
  const game = GAMES[MENU.scriptId];
  if (names.length < game.minPlayers) { alert('Need at least ' + game.minPlayers + ' players'); return; }
  if (names.length > game.maxPlayers) { alert('At most ' + game.maxPlayers + ' players'); return; }
  seedRng((Date.now() ^ 0x9e3779b9) >>> 0);
  G = game.create(names);
  VIEWER = 0; SCREEN = 'pass'; undoStack = []; _pendingAskValue = null; _raiseAmount = null;
  render();
}

function takeAction(cmd) {
  const game = GAMES[G.scriptId];
  const prev = { state: clone(G), viewer: VIEWER };
  const prevCurrent = G.current;
  let next;
  try { next = game.apply(G, cmd); }
  catch (e) { alert(e.message); return; }
  undoStack.push(prev);
  G = next;
  _raiseAmount = null;
  if (G.ended) SCREEN = 'game';
  else if (G.current !== prevCurrent && G.phase !== 'chooseProp') {
    VIEWER = G.current; SCREEN = 'pass';
  } else SCREEN = 'game';
  render();
}

function undo() {
  if (undoStack.length === 0) return;
  const entry = undoStack.pop();
  G = entry.state; VIEWER = entry.viewer;
  SCREEN = 'game'; _pendingAskValue = null; _raiseAmount = null;
  render();
}

function playAgain() {
  const names = G.players.map(p => p.name);
  const game = GAMES[G.scriptId];
  seedRng((Date.now() ^ 0x9e3779b9) >>> 0);
  G = game.create(names);
  VIEWER = 0; SCREEN = 'pass'; undoStack = []; _pendingAskValue = null; _raiseAmount = null;
  render();
}

// ============================================================
// Init
// ============================================================

render();
</script>
