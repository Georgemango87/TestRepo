<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Baby Name</title>
<meta name="description" content="Add your guess for the baby's name!">
<style>
  :root {
    --pink: #ec4899;
    --purple: #8b5cf6;
    --ink: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 64px;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 8% -10%, #ffe4f1 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #dbeafe 0%, transparent 55%),
      linear-gradient(180deg, #fffafc 0%, #f6f6ff 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  .emoji { font-size: 44px; line-height: 1; }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 10px 0 8px;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); margin: 0 auto; max-width: 44ch; line-height: 1.55; }

  .card {
    background: #fff;
    border: 1px solid rgba(236, 72, 153, 0.12);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow:
      0 10px 30px -12px rgba(139, 92, 246, 0.35),
      0 2px 8px rgba(0, 0, 0, 0.04);
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: #4b5563;
  }
  input {
    width: 100%;
    padding: 13px 15px;
    margin-bottom: 16px;
    border: 1.5px solid #e5e7eb;
    border-radius: 14px;
    background: #fcfcfd;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder { color: #b6bcc7; }
  input:focus {
    outline: none;
    background: #fff;
    border-color: var(--pink);
    box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.15);
  }

  button[type="submit"] {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #f472b6, #a855f7);
    box-shadow: 0 8px 20px -8px rgba(168, 85, 247, 0.85);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(168, 85, 247, 0.9); }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .msg { margin: 14px 0 0; font-size: 0.9rem; text-align: center; }
  .msg.ok { color: #059669; }
  .msg.error { color: #dc2626; }

  .list-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 16px;
  }
  .list-head h2 { font-size: 1.15rem; margin: 0; }
  .count { color: var(--muted); font-size: 0.95rem; font-weight: 600; }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .guess {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid #f0e9ff;
    border-radius: 16px;
    background: #faf7ff;
  }
  .avatar {
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-weight: 800;
    color: #3b2a4a;
  }
  .guess-text { flex: 1; min-width: 0; }
  .who {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .what {
    display: block;
    font-size: 1.05rem;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .remove {
    border: 0;
    background: transparent;
    color: #c0b6d0;
    font-size: 1.3rem;
    line-height: 1;
    padding: 4px 9px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .remove:hover { background: #ffe4e6; color: #e11d48; }

  .empty {
    margin: 0;
    padding: 26px 16px;
    text-align: center;
    color: var(--muted);
    border: 2px dashed #ece3f8;
    border-radius: 16px;
  }

  .loading {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .footer { text-align: center; margin-top: 10px; }
  .link-btn {
    border: 0;
    background: none;
    font: inherit;
    font-size: 0.82rem;
    color: #a1a1aa;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }
  .link-btn:hover { color: #e11d48; }
</style>
</head>
<body>
<main>
  <header>
    <div class="emoji" aria-hidden="true">👶</div>
    <h1>Guess the Baby Name</h1>
    <p class="sub">Think you know what we're naming the little one? Add your guess below and see what everyone else thinks.</p>
  </header>

  <section class="card">
    <form id="guess-form" novalidate>
      <label for="guesser">Your name</label>
      <input id="guesser" type="text" placeholder="e.g. Auntie Rachel" maxlength="40" autocomplete="name" required>

      <label for="guess">Your baby-name guess</label>
      <input id="guess" type="text" placeholder="e.g. Oliver" maxlength="40" required>

      <button type="submit" id="submit-btn">Lock in my guess 🎉</button>
      <p id="form-msg" class="msg" role="status" aria-live="polite" hidden></p>
    </form>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>Everyone's guesses</h2>
      <span id="count" class="count"></span>
    </div>
    <div id="list-loading" class="loading">Loading guesses…</div>
    <ul id="guess-list" class="list"></ul>
    <p id="empty" class="empty" hidden>No guesses yet — be the first!</p>
  </section>
</main>

<!-- ============================================================
     Firebase SDK (modular v9+ via CDN)
     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc,
  updateDoc,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

/* ============================================================
   🔥 REPLACE THIS WITH YOUR OWN FIREBASE CONFIG
   ============================================================
   Go to https://console.firebase.google.com
   → Create a project → Add a web app → Copy the config object below.
*/
const firebaseConfig = {
  apiKey: "AIzaSyAhzYCKr8EtEZ_p6EkANp36l_G1Nc3WbIc",
  authDomain: "guess-the-baby-name.firebaseapp.com",
  projectId: "guess-the-baby-name",
  storageBucket: "guess-the-baby-name.firebasestorage.app",
  messagingSenderId: "129095042080",
  appId: "1:129095042080:web:e5e6ce73db48013642a845",
  measurementId: "G-6Q37VJVZZW"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const GUESSES_COLLECTION = "guesses";

/* ============================================================
   UI references
   ============================================================ */
const form       = document.getElementById("guess-form");
const nameInput  = document.getElementById("guesser");
const guessInput = document.getElementById("guess");
const submitBtn  = document.getElementById("submit-btn");
const msgEl      = document.getElementById("form-msg");
const listEl     = document.getElementById("guess-list");
const emptyEl    = document.getElementById("empty");
const countEl    = document.getElementById("count");
const loadingEl  = document.getElementById("list-loading");

let guesses = [];       // local mirror of Firestore data
let msgTimer = null;
let unsubscribe = null; // onSnapshot unsubscribe

/* ============================================================
   Utilities
   ============================================================ */
function colorFor(str) {
  const palette = ["#f9a8d4", "#a5b4fc", "#93c5fd", "#6ee7b7",
                   "#fcd34d", "#fca5a5", "#c4b5fd", "#5eead4"];
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash * 31 + str.charCodeAt(i)) % 100000;
  }
  return palette[hash % palette.length];
}

function tidy(str) {
  return str.replace(/\s+/g, " ").trim();
}

function showMessage(text, isError) {
  msgEl.textContent = text;
  msgEl.hidden = false;
  msgEl.classList.toggle("error", !!isError);
  msgEl.classList.toggle("ok", !isError);
  clearTimeout(msgTimer);
  if (!isError) {
    msgTimer = setTimeout(() => { msgEl.hidden = true; }, 6000);
  }
}

/* ============================================================
   Rendering
   ============================================================ */
function render() {
  listEl.textContent = "";

  countEl.textContent = guesses.length ? `(${guesses.length})` : "";
  emptyEl.hidden = guesses.length > 0;
  loadingEl.hidden = true;

  guesses.forEach(g => {
    const li = document.createElement("li");
    li.className = "guess";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.style.background = colorFor(g.name);
    avatar.textContent = (g.name.charAt(0) || "?").toUpperCase();
    avatar.setAttribute("aria-hidden", "true");

    const text = document.createElement("div");
    text.className = "guess-text";

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = g.name;

    const what = document.createElement("span");
    what.className = "what";
    what.textContent = g.guess;

    text.appendChild(who);
    text.appendChild(what);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "remove";
    del.textContent = "×";
    del.title = `Remove ${g.name}'s guess`;
    del.setAttribute("aria-label", `Remove ${g.name}'s guess`);
    del.addEventListener("click", () => removeGuess(g.id, g.name));

    li.appendChild(avatar);
    li.appendChild(text);
    li.appendChild(del);
    listEl.appendChild(li);
  });
}

/* ============================================================
   Firestore: listen for real-time updates
   ============================================================ */
function startListener() {
  loadingEl.hidden = false;
  emptyEl.hidden = true;

  const q = query(
    collection(db, GUESSES_COLLECTION),
    orderBy("createdAt", "asc")
  );

  unsubscribe = onSnapshot(q,
    snapshot => {
      guesses = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));
      render();
    },
    error => {
      console.error("Firestore listen error:", error);
      loadingEl.hidden = true;
      showMessage("Could not load guesses. Check your Firebase config & rules.", true);
    }
  );
}

/* ============================================================
   Add / update a guess
   ============================================================ */
async function saveGuess(name, guess) {
  const nameLower = name.toLowerCase();

  // Look for an existing entry with the same name (case-insensitive)
  const existingQuery = query(
    collection(db, GUESSES_COLLECTION),
    where("nameLower", "==", nameLower)
  );
  const existingSnap = await getDocs(existingQuery);

  if (!existingSnap.empty) {
    // Update the first matching document
    const docRef = doc(db, GUESSES_COLLECTION, existingSnap.docs[0].id);
    await updateDoc(docRef, {
      name,
      guess,
      updatedAt: serverTimestamp()
    });
    return { updated: true, name };
  } else {
    // Create a new document
    await addDoc(collection(db, GUESSES_COLLECTION), {
      name,
      nameLower,
      guess,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    return { updated: false, name };
  }
}

/* ============================================================
   Remove a guess
   ============================================================ */
async function removeGuess(id, name) {
  if (!window.confirm(`Remove ${name}'s guess?`)) return;

  try {
    await deleteDoc(doc(db, GUESSES_COLLECTION, id));
    // onSnapshot will refresh the list automatically
  } catch (err) {
    console.error("Delete failed:", err);
    showMessage("Could not remove that guess. Please try again.", true);
  }
}

/* ============================================================
   Form submit
   ============================================================ */
form.addEventListener("submit", async e => {
  e.preventDefault();

  const name  = tidy(nameInput.value);
  const guess = tidy(guessInput.value);

  if (!name) {
    showMessage("Please enter your name.", true);
    nameInput.focus();
    return;
  }
  if (!guess) {
    showMessage("Please enter your baby-name guess.", true);
    guessInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Saving…";

  try {
    const result = await saveGuess(name, guess);

    if (result.updated) {
      showMessage(`Updated ${name}'s guess to “${guess}”.`);
    } else {
      showMessage(`Thanks, ${name}! Your guess “${guess}” is in. 🎉`);
    }

    form.reset();
    nameInput.focus();
  } catch (err) {
    console.error("Save failed:", err);
    showMessage("Could not save your guess. Check your Firebase rules & try again.", true);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Lock in my guess 🎉";
  }
});

/* ============================================================
   Boot
   ============================================================ */
startListener();

// Clean up listener on page hide (not strictly necessary, but tidy)
window.addEventListener("pagehide", () => {
  if (unsubscribe) unsubscribe();
});
</script>
</body>
</html>
